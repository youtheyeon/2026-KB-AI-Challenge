# 로컬 도메인 영속성 검증을 위한 PostgreSQL 서비스
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kb_ai_challenge
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kb_ai_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10
