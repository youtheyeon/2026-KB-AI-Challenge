name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: kb_ai_challenge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kb_ai_challenge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kb_ai_challenge_test
      BACKEND_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kb_ai_challenge_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kb_ai_challenge_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
